# =============================================================================
# HUISHOUDEN – wasmachine/droogkast via Shelly Plug, afvalophaling
# =============================================================================
#   sensor.wasmachine_vermogen   W (Shelly Plug)
#   sensor.droogkast_vermogen    W (Shelly Plug)
#   Afval: RecycleApp-integratie (olibos), één sensor per fractie met de volgende ophaaldatum.
#   AFVAL_SENSOREN: lijst in custom_templates/afval.jinja
#
# Drempels per toestel even nakijken in de geschiedenis van de vermogenssensor:
# sommige toestellen blijven na het programma enkele watt trekken (display, anti-kreuk).

input_boolean:
  wasmachine_draait:
    name: Wasmachine draait
    icon: mdi:washing-machine
  droogkast_draait:
    name: Droogkast draait
    icon: mdi:tumble-dryer

automation:
  - id: huishouden_toestel_klaar
    alias: Huishouden – wasmachine/droogkast klaar
    mode: parallel
    triggers:
      - trigger: numeric_state
        entity_id:
          - sensor.wasmachine_vermogen
          - sensor.droogkast_vermogen
        above: 10
        for:
          minutes: 2
        id: start
      - trigger: numeric_state
        entity_id:
          - sensor.wasmachine_vermogen
          - sensor.droogkast_vermogen
        below: 3
        for:
          minutes: 5
        id: stop
    variables:
      toestel: "{{ 'wasmachine' if 'wasmachine' in trigger.entity_id else 'droogkast' }}"
      vlag: "input_boolean.{{ toestel }}_draait"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: start
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ vlag }}"
          - conditions:
              - condition: trigger
                id: stop
              - condition: template
                value_template: "{{ is_state(vlag, 'on') }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ vlag }}"
              - action: notify.mobile_app_gsm
                data:
                  title: "{{ '🧺 Wasmachine' if toestel == 'wasmachine' else '🌀 Droogkast' }} klaar"
                  message: "Het programma is gedaan."

  - id: huishouden_afval_morgen
    alias: Huishouden – afval buitenzetten
    mode: single
    triggers:
      - trigger: time
        at: "19:00:00"
    conditions:
      - condition: template
        value_template: "{{ state_attr('sensor.afval_volgende_ophaling', 'dagen') == 1 }}"
    actions:
      - action: notify.mobile_app_gsm
        data:
          title: "🗑️ Afval buitenzetten"
          message: "{{ states('sensor.afval_volgende_ophaling') }}"

template:
  - sensor:
      - name: Afval volgende ophaling
        unique_id: afval_volgende_ophaling
        icon: mdi:trash-can
        state: >
          {% from 'afval.jinja' import afval_ophalingen %}
          {% set o = afval_ophalingen() | from_json %}
          {{ o[0].tekst if o | count > 0 else 'Geen ophaling gepland' }}
        attributes:
          datum: >
            {% from 'afval.jinja' import afval_ophalingen %}
            {% set o = afval_ophalingen() | from_json %}
            {{ o[0].datum if o | count > 0 else none }}
          dagen: >
            {% from 'afval.jinja' import afval_ophalingen %}
            {% set o = afval_ophalingen() | from_json %}
            {{ o[0].dagen if o | count > 0 else none }}
          planning: >
            {% from 'afval.jinja' import afval_ophalingen %}
            {{ afval_ophalingen() | from_json | map(attribute='tekst') | list }}
