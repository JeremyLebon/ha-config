# =============================================================================
# NIEUWS – VRT NWS, Het Nieuwsblad, Focus-WTV -> koppen (of optioneel AI) -> voorlezen via TTS
# =============================================================================
# Standaard: per bron de belangrijkste koppen letterlijk voorlezen, zonder AI en zonder kosten.
# Optioneel: bestaat de entiteit ai_task.samenvatter, dan maakt die er een bulletin van
#   (bv. Ollama lokaal op een pc/NAS, of Google Gemini). Zonder die entiteit: gewoon de koppen.
#
# Bronnen (RESTful zet XML automatisch om naar JSON):
#   VRT NWS        Atom   feed/entry          -> sensor.nieuws_vrt        (attribuut 'entry')
#   Het Nieuwsblad RSS    rss/channel/item    -> sensor.nieuws_nieuwsblad (attribuut 'item')
#   Focus-WTV      heeft geen eigen feed; via een Google News-zoekopdracht op focus-wtv.be
#                  RSS    rss/channel/item    -> sensor.nieuws_focus_wtv  (attribuut 'item')
#   Bron toevoegen: rest-blok kopiëren + toevoegen aan de lijst 'bronnen' in het script.
#
# Benodigd:
#   - TTS: Piper (add-on + Wyoming, lokaal) met een Vlaamse stem (nl_BE-nathalie of nl_BE-rdh),
#     of Home Assistant Cloud (nl-BE)                              -> tts.piper
#   - Een speaker als media_player die TTS kan afspelen (Cast/Sonos/ESPHome-satelliet, ...)
#                                                                  -> media_player.speaker

input_boolean:
  nieuws_ochtend:
    name: Nieuws 's ochtends voorlezen
    icon: mdi:newspaper-variant-outline

input_datetime:
  nieuws_ochtend_tijd:
    name: Tijd ochtendnieuws
    has_date: false
    has_time: true
    initial: "07:15:00"

recorder:
  exclude:
    entities: # grote attributen, horen niet in de database
      - sensor.nieuws_vrt
      - sensor.nieuws_nieuwsblad
      - sensor.nieuws_focus_wtv

rest:
  - resource: https://www.vrt.be/vrtnws/nl.rss.articles.xml
    scan_interval: 1800
    timeout: 20
    sensor:
      - name: Nieuws VRT
        unique_id: nieuws_vrt
        icon: mdi:newspaper
        value_template: "{% set i = value_json.feed.entry | default([]) %}{{ 1 if i is mapping else i | count }}"
        json_attributes_path: "$.feed"
        json_attributes:
          - entry

  - resource: https://www.nieuwsblad.be/rss
    scan_interval: 1800
    timeout: 20
    headers:
      User-Agent: Mozilla/5.0 (X11; Linux aarch64) HomeAssistant
    sensor:
      - name: Nieuws Nieuwsblad
        unique_id: nieuws_nieuwsblad
        icon: mdi:newspaper
        value_template: "{% set i = value_json.rss.channel.item | default([]) %}{{ 1 if i is mapping else i | count }}"
        json_attributes_path: "$.rss.channel"
        json_attributes:
          - item

  - resource: https://news.google.com/rss/search?q=site:focus-wtv.be+when:2d&hl=nl&gl=BE&ceid=BE:nl
    scan_interval: 1800
    timeout: 20
    sensor:
      - name: Nieuws Focus-WTV
        unique_id: nieuws_focus_wtv
        icon: mdi:television-classic
        value_template: "{% set i = value_json.rss.channel.item | default([]) %}{{ 1 if i is mapping else i | count }}"
        json_attributes_path: "$.rss.channel"
        json_attributes:
          - item

template:
  # Laatste samenvatting bewaren voor het dashboard
  - triggers:
      - trigger: event
        event_type: nieuws_samenvatting
    sensor:
      - name: Nieuws samenvatting
        unique_id: nieuws_samenvatting
        icon: mdi:text-box-outline
        device_class: timestamp
        state: "{{ now().isoformat() }}"
        attributes:
          tekst: "{{ trigger.event.data.tekst }}"

script:
  nieuws_samenvatting:
    alias: Nieuws – samenvatting maken (en voorlezen)
    icon: mdi:newspaper-variant
    mode: single
    fields:
      voorlezen:
        name: Voorlezen
        default: false
        selector:
          boolean:
      koppen_per_bron:
        name: Koppen per bron
        default: 3
        selector:
          number:
            min: 1
            max: 10
    sequence:
      - variables:
          bronnen:
            - naam: VRT NWS
              sensor: sensor.nieuws_vrt
            - naam: Het Nieuwsblad
              sensor: sensor.nieuws_nieuwsblad
            - naam: Focus-WTV
              sensor: sensor.nieuws_focus_wtv
              google: true # Google News zet " - Focus-WTV" achter elke titel
          n: "{{ koppen_per_bron | default(3) | int }}"
          # Per bron: lijst van {titel, tekst}, ongeacht Atom of RSS
          berichten: >
            {% set ns = namespace(uit=[]) %}
            {% for b in bronnen %}
              {% set items = state_attr(b.sensor, 'entry') or state_attr(b.sensor, 'item') or [] %}
              {% if items is mapping %}{% set items = [items] %}{% endif %}
              {% set nb = namespace(l=[]) %}
              {% for e in items[:n] %}
                {% set t = e.get('title', '') %}
                {% set t = (t['#text'] if t is mapping else t) | string %}
                {% if b.get('google') %}{% set t = t | regex_replace(' - (?!.* - ).*$', '') %}{% endif %}
                {% set t = t | trim %}
                {% set s = e.get('summary', e.get('description', '')) %}
                {% set s = (s['#text'] if s is mapping else (s or '')) | string %}
                {% set nb.l = nb.l + [{'titel': t, 'tekst': s | striptags | truncate(250)}] %}
              {% endfor %}
              {% if nb.l | count > 0 %}
                {% set ns.uit = ns.uit + [{'naam': b.naam, 'items': nb.l}] %}
              {% endif %}
            {% endfor %}
            {{ ns.uit }}
      - condition: template
        value_template: "{{ berichten | count > 0 }}"
      - if:
          # AI-samenvatting alleen als er een AI-taak-entiteit gekoppeld is
          - condition: template
            value_template: >
              {{ states.ai_task | selectattr('entity_id', 'eq', 'ai_task.samenvatter') | list | count > 0 }}
        then:
          - action: ai_task.generate_data
            data:
              task_name: nieuwssamenvatting
              entity_id: ai_task.samenvatter
              instructions: |
                Je bent de nieuwslezer van een Vlaams gezin in West-Vlaanderen. Maak van de
                berichten hieronder een kort radiobulletin in vlot, gesproken Nederlands:
                maximaal acht zinnen. Eerst het belangrijkste nationale nieuws, dan buitenland,
                dan regionaal nieuws uit West-Vlaanderen (Focus-WTV). Laat dubbele berichten
                van verschillende bronnen samenvallen. Geen opsommingstekens, geen markdown,
                geen koppen, schrijf getallen zoals je ze uitspreekt.

                {% for b in berichten %}
                {{ b.naam }}:
                {% for i in b['items'] %}- {{ i.titel }}: {{ i.tekst }}
                {% endfor %}
                {% endfor %}
            response_variable: resultaat
          - variables:
              bulletin: "{{ resultaat.data }}"
        else:
          # Zonder AI: per bron de koppen als gesproken tekst
          - variables:
              bulletin: >
                {% set ns = namespace(l=[]) %}
                {% for b in berichten %}
                  {% set ns.l = ns.l + [b.naam ~ '. ' ~ (b['items'] | map(attribute='titel') | join('. ')) ~ '.'] %}
                {% endfor %}
                Het nieuws. {{ ns.l | join(' ') }}
      - event: nieuws_samenvatting
        event_data:
          tekst: "{{ bulletin }}"
      - if:
          - condition: template
            value_template: "{{ voorlezen | default(false) }}"
        then:
          - action: tts.speak
            target:
              entity_id: tts.piper
            data:
              media_player_entity_id: media_player.speaker
              message: "{{ bulletin }}"
              cache: false

automation:
  - id: nieuws_ochtend
    alias: Nieuws – ochtendbulletin voorlezen
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.nieuws_ochtend_tijd
    conditions:
      - condition: state
        entity_id: input_boolean.nieuws_ochtend
        state: "on"
      - condition: time
        weekday: [mon, tue, wed, thu, fri]
    actions:
      - action: script.nieuws_samenvatting
        data:
          voorlezen: true
