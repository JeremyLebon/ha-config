# Koppeling placeholder -> echte entiteit in jouw Home Assistant
# Vul rechts de echte entity_id in (Instellingen > Entiteiten, of Ontwikkelhulpmiddelen > Statussen).
# Leeg laten = nog niet gekoppeld. Daarna: python3 tools/koppel_entiteiten.py
# Tussen haakjes staat een typische naam, ter indicatie (kan bij jou anders zijn).

# --- Meldingen ---------------------------------------------------------------
notify.mobile_app_gsm:                # notify.mobile_app_<naam_van_je_gsm>

# --- Energie: HomeWizard P1 --------------------------------------------------
sensor.p1_vermogen: sensor.woonkamer_p1_meter_realtime_vermogen   # sensor.p1_meter_power
sensor.p1_kwartiergemiddelde: sensor.kwartiergemiddelde_berekend   # sensor.p1_meter_average_demand
sensor.p1_maandpiek: sensor.maandpiek_berekend   # sensor.p1_meter_peak_demand_current_month

# --- Energie: SolarEdge (solaredge-modbus-multi) -----------------------------
sensor.pv_vermogen:                   # sensor.solaredge_i1_ac_power

# --- Energie: Marstek ---------------------------------------------------------
sensor.batterij_vermogen: sensor.marstek_venus_1_ac_power   # afhankelijk van integratie (positief = ontladen!)
sensor.batterij_soc: sensor.marstek_venus_1_battery_soc   # sensor.marstek_..._battery_soc
select.batterij_forceer_modus: select.marstek_venus_1_force_mode   # select.marstek_..._force_mode
number.batterij_ontlaadvermogen: number.marstek_venus_1_set_discharge_power   # number.marstek_..._discharge_power
number.batterij_laadvermogen: number.marstek_venus_1_set_charge_power   # number.marstek_..._charge_power

# --- Prijzen: ENTSO-E ---------------------------------------------------------
sensor.stroomprijs_nu:                # sensor.current_electricity_market_price
sensor.stroomprijs_gem:               # sensor.average_electricity_price_today

# --- PV-verwachting: Forecast.Solar (of Solcast) -----------------------------
sensor.pv_verwachting_vandaag_rest:   # sensor.energy_production_today_remaining
sensor.pv_verwachting_morgen:         # sensor.energy_production_tomorrow

# --- Verwarming ---------------------------------------------------------------
climate.vaillant_zone: climate.my_home_zone_thuis_circuit_0_climate   # climate.<systeem>_zone_1 (myVAILLANT)
sensor.vaillant_waterdruk: sensor.lebonjeremy_hotmail_com_my_home_system_water_pressure
climate.pelletkachel:                 # climate.<naam_kachel> (Austroflamm/Fumis)
climate.badkamer:                     # climate.<blumfeldt...> (Tuya / Smart Life)

# --- Huishouden: Shelly + afval ------------------------------------------------
sensor.wasmachine_vermogen:           # sensor.shelly_plug_..._power
sensor.droogkast_vermogen:            # sensor.shelly_plug_..._power
calendar.afvalophaling:               # calendar.recycle_... of je iCal-kalender

# --- Gezin ---------------------------------------------------------------------
calendar.smartschool:                 # calendar.smartschool (Remote Calendar)
sensor.nmbs_trein:                    # sensor.kortrijk_gent_sint_pieters
sensor.lidl_koffie:                   # trefwoordsensor uit Lidl Weekly Offers
sensor.lidl_luiers:                   # trefwoordsensor uit Lidl Weekly Offers

# --- Info / weer ----------------------------------------------------------------
weather.thuis:                        # weather.forecast_home of weather.<kmi>
camera.buienradar:                    # camera.buienradar
sensor.beurs_bel20:                   # sensor.yahoofinance_bfx
sensor.beurs_msci_world:              # sensor.yahoofinance_iwda_as

# --- Nieuws: AI-taak + TTS + speaker ----------------------------------------------
ai_task.samenvatter:                  # optioneel (Ollama/Gemini); leeg laten = koppen voorlezen zonder AI
tts.piper:                            # tts.piper of tts.home_assistant_cloud
media_player.speaker:                 # media_player.<speaker die TTS kan afspelen>

# --- Onderhoud: Watchman + System Monitor ---------------------------------------
sensor.watchman_ontbrekende_entiteiten: # sensor.watchman_missing_entities
sensor.watchman_ontbrekende_acties:   # sensor.watchman_missing_actions
sensor.pi_cpu_temperatuur:            # sensor.system_monitor_processor_temperature
sensor.pi_schijfgebruik:              # sensor.system_monitor_disk_usage
