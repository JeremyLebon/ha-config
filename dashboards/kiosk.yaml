# =============================================================================
# KIOSK-DASHBOARD – 7" touchscreen (Raspberry Pi Touch Display 2, liggend)
# HACS-frontend nodig: power-flow-card-plus, clock-weather-card, mini-graph-card, kiosk-mode
# Swipen tussen views: Energie / Vandaag / Info
# =============================================================================
kiosk_mode:
  hide_header: true
  hide_sidebar: true

title: Thuis
views:
  # ---------------------------------------------------------------- ENERGIE
  - title: Energie
    path: energie
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:power-flow-card-plus
            grid_options:
              columns: full
            entities:
              grid:
                entity: sensor.woonkamer_p1_meter_realtime_vermogen
              solar:
                entity: sensor.pv_vermogen
              battery:
                entity: sensor.marstek_venus_1_ac_power
                state_of_charge: sensor.marstek_venus_1_battery_soc
              home:
                entity: sensor.huisverbruik
            w_decimals: 0
            kw_decimals: 2
            watt_threshold: 1000

      - type: grid
        cards:
          - type: heading
            heading: Capaciteitstarief
          - type: gauge
            name: Voorspeld kwartier
            entity: sensor.voorspelde_kwartierpiek
            unit: W
            min: 0
            max: 8000
            needle: true
            severity:
              green: 0
              yellow: 2000
              red: 2500
          - type: tile
            entity: sensor.maandpiek_berekend
            name: Maandpiek
          - type: tile
            entity: sensor.effectieve_piekgrens
            name: Grens
          - type: tile
            entity: input_boolean.peak_shaving_actief
            name: Peak shaving
          - type: tile
            entity: binary_sensor.kwartierpiek_dreigt
            name: Piek dreigt

      - type: grid
        cards:
          - type: heading
            heading: Stroomprijs & batterij
          - type: tile
            entity: sensor.stroomprijs_nu
            name: Prijs nu
          - type: tile
            entity: binary_sensor.goedkoop_uur
            name: Goedkoop uur
          - type: tile
            entity: sensor.marstek_venus_1_battery_soc
            name: Batterij
          - type: tile
            entity: input_boolean.laden_op_goedkope_uren
            name: Laden op goedkope uren
          - type: tile
            entity: sensor.pv_verwachting_morgen
            name: PV morgen
          - type: tile
            entity: binary_sensor.zon_vult_batterij
            name: Zon vult batterij
          - type: custom:mini-graph-card
            name: Net vandaag
            grid_options:
              columns: full
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            entities:
              - entity: sensor.woonkamer_p1_meter_realtime_vermogen
                name: Net
              - entity: sensor.pv_vermogen
                name: PV

  # ---------------------------------------------------------------- VANDAAG
  - title: Vandaag
    path: vandaag
    icon: mdi:calendar-today
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:clock-weather-card
            entity: weather.thuis
            grid_options:
              columns: full
            locale: nl
            time_format: 24
            forecast_rows: 4
            hide_today_section: false

      - type: grid
        cards:
          - type: picture-entity
            entity: camera.buienradar
            name: Buienradar
            show_state: false
            camera_view: auto
            grid_options:
              columns: full
          - type: tile
            entity: sensor.nmbs_trein
            name: Trein
            grid_options:
              columns: full
          - type: tile
            entity: sensor.afval_volgende_ophaling
            name: Afval
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: thermostat
            entity: climate.my_home_zone_thuis_circuit_0_climate
            name: Vaillant
          - type: thermostat
            entity: climate.pelletkachel
            name: Kachel
          - type: tile
            entity: sensor.pellets_resterend
            name: Pellets
          - type: button
            entity: input_button.pellets_bijgevuld
            name: Bijgevuld
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.pellets_bijgevuld

      - type: grid
        cards:
          - type: thermostat
            entity: climate.badkamer
            name: Badkamer
          - type: tile
            entity: timer.badkamer
            name: Boost
          - type: button
            name: 30 min
            icon: mdi:radiator
            tap_action:
              action: perform-action
              perform_action: script.badkamer_boost
              data:
                minuten: 30
          - type: button
            name: 60 min
            icon: mdi:radiator
            tap_action:
              action: perform-action
              perform_action: script.badkamer_boost
              data:
                minuten: 60
          - type: button
            name: Stop
            icon: mdi:radiator-off
            tap_action:
              action: perform-action
              perform_action: script.badkamer_stop

      - type: grid
        cards:
          - type: markdown
            title: Nieuws
            grid_options:
              columns: full
            content: >
              {{ state_attr('sensor.nieuws_samenvatting', 'tekst')
                 or 'Nog geen samenvatting. Tik op Samenvatten.' }}
          - type: button
            name: Samenvatten
            icon: mdi:text-box-outline
            tap_action:
              action: perform-action
              perform_action: script.nieuws_samenvatting
              data:
                voorlezen: false
          - type: button
            name: Voorlezen
            icon: mdi:account-voice
            tap_action:
              action: perform-action
              perform_action: script.nieuws_samenvatting
              data:
                voorlezen: true

      - type: grid
        cards:
          - type: calendar
            title: Smartschool
            initial_view: listWeek
            entities:
              - calendar.smartschool
            grid_options:
              columns: full

  # ---------------------------------------------------------------- INFO
  - title: Info
    path: info
    icon: mdi:information-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Beurs
          - type: custom:mini-graph-card
            name: BEL20
            entities:
              - sensor.beurs_bel20
            hours_to_show: 168
            points_per_hour: 0.5
            grid_options:
              columns: full
          - type: custom:mini-graph-card
            name: MSCI World
            entities:
              - sensor.beurs_msci_world
            hours_to_show: 168
            points_per_hour: 0.5
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Promoties
          - type: tile
            entity: sensor.lidl_in_promo
            name: Lidl
          - type: tile
            entity: sensor.colruyt_in_promo
            name: Colruyt
          - type: markdown
            grid_options:
              columns: full
            content: |
              {% set lidl = state_attr('sensor.lidl_in_promo', 'producten') or [] %}
              {% set col = state_attr('sensor.colruyt_in_promo', 'producten') or [] %}
              **Lidl**
              {% for p in lidl %}
              - {{ p }}
              {% else %}
              - niets van je lijst
              {% endfor %}

              **Colruyt**
              {% for p in col %}
              - {{ p }}
              {% else %}
              - niets van je lijst
              {% endfor %}
          - type: entities
            grid_options:
              columns: full
            entities:
              - entity: input_text.colruyt_winkel_id
                name: Colruyt winkel-id

      - type: grid
        cards:
          - type: heading
            heading: Toestellen
          - type: tile
            entity: input_boolean.wasmachine_draait
            name: Wasmachine
          - type: tile
            entity: input_boolean.droogkast_draait
            name: Droogkast
          - type: tile
            entity: input_boolean.kachel_vaillant_koppeling
            name: Kachel ↔ Vaillant

      - type: grid
        cards:
          - type: heading
            heading: Server
          - type: tile
            entity: sensor.pi_cpu_temperatuur
            name: CPU-temperatuur
          - type: tile
            entity: sensor.pi_schijfgebruik
            name: Schijf
          - type: tile
            entity: sensor.watchman_ontbrekende_entiteiten
            name: Ontbrekende entiteiten
