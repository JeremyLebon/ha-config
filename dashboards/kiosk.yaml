# =============================================================================
# KIOSK-DASHBOARD – 7" touchscreen (Raspberry Pi Touch Display 2, liggend)
# Kaarten uit de Marketplace nodig: power-flow-card-plus, clock-weather-card, mini-graph-card, kiosk-mode
# Navigatie: knoppenbalk bovenaan elke view (Vandaag / Energie / Info); Vandaag is de startpagina
# =============================================================================
kiosk_mode:
  hide_header: true
  hide_sidebar: true

title: Thuis
views:
  # ---------------------------------------------------------------- VANDAAG
  - title: Vandaag
    path: vandaag
    icon: mdi:calendar-today
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: button
            name: Vandaag
            icon: mdi:calendar-today
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/vandaag
          - type: button
            name: Energie
            icon: mdi:lightning-bolt
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/energie
          - type: button
            name: Info
            icon: mdi:information-outline
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/info
          - type: button
            name: Promo
            icon: mdi:cart-percent
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/promo
      - type: grid
        cards:
          - type: custom:clock-weather-card
            entity: weather.thuis
            grid_options:
              columns: full
            locale: nl
            time_format: 24
            forecast_rows: 4
            hide_today_section: false

      - type: grid
        cards:
          - type: picture-entity
            entity: camera.buienradar
            name: Buienradar
            show_state: false
            camera_view: auto
            grid_options:
              columns: full
          - type: tile
            entity: sensor.nmbs_trein
            name: Trein
            grid_options:
              columns: full
          - type: tile
            entity: sensor.afval_volgende_ophaling
            name: Afval
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Verwarming
            icon: mdi:radiator
          - type: thermostat
            entity: climate.my_home_zone_thuis_circuit_0_climate
            name: Vaillant
            grid_options:
              columns: full
          - type: tile
            entity: sensor.lebonjeremy_hotmail_com_my_home_outdoor_temperature
            name: Buiten
          - type: tile
            entity: sensor.my_home_zone_thuis_circuit_0_current_temperature
            name: Binnen
          - type: tile
            entity: water_heater.my_home_domestic_hot_water_0
            name: Warm water
          - type: tile
            entity: sensor.lebonjeremy_hotmail_com_my_home_domestic_hot_water_0_tank_temperature
            name: Boiler
          - type: tile
            entity: sensor.lebonjeremy_hotmail_com_my_home_system_water_pressure
            name: Waterdruk
          - type: tile
            entity: switch.lebonjeremy_hotmail_com_my_home_domestic_hot_water_0_boost
            name: Warm water boost

      # Pelletkachel: verschijnt pas als de Austroflamm-integratie gekoppeld is
      - type: grid
        visibility:
          - condition: state
            entity: binary_sensor.kachel_beschikbaar
            state: "on"
        cards:
          - type: heading
            heading: Pelletkachel
            icon: mdi:fireplace
          - type: thermostat
            entity: climate.pelletkachel
            name: Kachel
            grid_options:
              columns: full
          - type: tile
            entity: sensor.pellets_resterend
            name: Pellets
          - type: button
            entity: input_button.pellets_bijgevuld
            name: Bijgevuld
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.pellets_bijgevuld

      # Badkamer: verschijnt pas als de Tuya-verwarming gekoppeld is
      - type: grid
        visibility:
          - condition: state
            entity: binary_sensor.badkamer_beschikbaar
            state: "on"
        cards:
          - type: heading
            heading: Badkamer
            icon: mdi:shower
          - type: thermostat
            entity: climate.badkamer
            name: Badkamer
          - type: tile
            entity: timer.badkamer
            name: Boost
          - type: button
            name: 30 min
            icon: mdi:radiator
            tap_action:
              action: perform-action
              perform_action: script.badkamer_boost
              data:
                minuten: 30
          - type: button
            name: 60 min
            icon: mdi:radiator
            tap_action:
              action: perform-action
              perform_action: script.badkamer_boost
              data:
                minuten: 60
          - type: button
            name: Stop
            icon: mdi:radiator-off
            tap_action:
              action: perform-action
              perform_action: script.badkamer_stop

      - type: grid
        cards:
          - type: markdown
            title: Nieuws
            grid_options:
              columns: full
            content: >
              {{ state_attr('sensor.nieuws_samenvatting', 'tekst')
                 or 'Nog geen samenvatting. Tik op Samenvatten.' }}
          - type: button
            name: Samenvatten
            icon: mdi:text-box-outline
            tap_action:
              action: perform-action
              perform_action: script.nieuws_samenvatting
              data:
                voorlezen: false
          - type: button
            name: Voorlezen
            icon: mdi:account-voice
            tap_action:
              action: perform-action
              perform_action: script.nieuws_samenvatting
              data:
                voorlezen: true

      - type: grid
        cards:
          - type: calendar
            title: Smartschool
            initial_view: listWeek
            entities:
              - calendar.smartschool
            grid_options:
              columns: full

  # ---------------------------------------------------------------- ENERGIE
  - title: Energie
    path: energie
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: button
            name: Vandaag
            icon: mdi:calendar-today
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/vandaag
          - type: button
            name: Energie
            icon: mdi:lightning-bolt
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/energie
          - type: button
            name: Info
            icon: mdi:information-outline
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/info
          - type: button
            name: Promo
            icon: mdi:cart-percent
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/promo
      - type: grid
        cards:
          - type: custom:power-flow-card-plus
            grid_options:
              columns: full
            entities:
              grid:
                entity: sensor.woonkamer_p1_meter_realtime_vermogen
              solar:
                entity: sensor.pv_vermogen
              battery:
                entity: sensor.marstek_venus_1_ac_power
                state_of_charge: sensor.marstek_venus_1_battery_soc
              home:
                entity: sensor.huisverbruik
            w_decimals: 0
            kw_decimals: 2
            watt_threshold: 1000

      - type: grid
        cards:
          - type: heading
            heading: Capaciteitstarief
          - type: gauge
            name: Voorspeld kwartier
            entity: sensor.voorspelde_kwartierpiek
            unit: W
            min: 0
            max: 8000
            needle: true
            severity:
              green: 0
              yellow: 2000
              red: 2500
          - type: tile
            entity: sensor.maandpiek_berekend
            name: Maandpiek
          - type: tile
            entity: sensor.effectieve_piekgrens
            name: Grens
          - type: tile
            entity: input_boolean.peak_shaving_actief
            name: Peak shaving
          - type: tile
            entity: binary_sensor.kwartierpiek_dreigt
            name: Piek dreigt

      - type: grid
        cards:
          - type: heading
            heading: Stroomprijs & batterij
          - type: tile
            entity: sensor.stroomprijs_nu
            name: Prijs nu
          - type: tile
            entity: binary_sensor.goedkoop_uur
            name: Goedkoop uur
          - type: tile
            entity: sensor.marstek_venus_1_battery_soc
            name: Batterij
          - type: tile
            entity: input_boolean.laden_op_goedkope_uren
            name: Laden op goedkope uren
          - type: tile
            entity: sensor.pv_verwachting_morgen
            name: PV morgen
          - type: tile
            entity: binary_sensor.zon_vult_batterij
            name: Zon vult batterij
          - type: custom:mini-graph-card
            name: Net vandaag
            grid_options:
              columns: full
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            entities:
              - entity: sensor.woonkamer_p1_meter_realtime_vermogen
                name: Net
              - entity: sensor.pv_vermogen
                name: PV

  # ---------------------------------------------------------------- INFO
  - title: Info
    path: info
    icon: mdi:information-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: button
            name: Vandaag
            icon: mdi:calendar-today
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/vandaag
          - type: button
            name: Energie
            icon: mdi:lightning-bolt
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/energie
          - type: button
            name: Info
            icon: mdi:information-outline
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/info
          - type: button
            name: Promo
            icon: mdi:cart-percent
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/promo
      - type: grid
        cards:
          - type: heading
            heading: Beurs
          - type: custom:mini-graph-card
            name: BEL20
            entities:
              - sensor.yahoofinance_bfx
            hours_to_show: 168
            points_per_hour: 0.5
            grid_options:
              columns: full
          - type: custom:mini-graph-card
            name: MSCI World
            entities:
              - sensor.yahoofinance_iwda_as
            hours_to_show: 168
            points_per_hour: 0.5
            grid_options:
              columns: full
          - type: custom:mini-graph-card
            name: Nvidia
            entities:
              - sensor.yahoofinance_nvda
            hours_to_show: 168
            points_per_hour: 0.5
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Toestellen
          - type: tile
            entity: input_boolean.wasmachine_draait
            name: Wasmachine
          - type: tile
            entity: input_boolean.droogkast_draait
            name: Droogkast
          - type: tile
            entity: input_boolean.kachel_vaillant_koppeling
            name: Kachel ↔ Vaillant

      - type: grid
        cards:
          - type: heading
            heading: Server
          - type: tile
            entity: sensor.pi_cpu_temperatuur
            name: CPU-temperatuur
          - type: tile
            entity: sensor.pi_schijfgebruik
            name: Schijf
          - type: tile
            entity: sensor.watchman_ontbrekende_entiteiten
            name: Ontbrekende entiteiten

  # ---------------------------------------------------------------- PROMO
  - title: Promo
    path: promo
    icon: mdi:cart-percent
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: button
            name: Vandaag
            icon: mdi:calendar-today
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/vandaag
          - type: button
            name: Energie
            icon: mdi:lightning-bolt
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/energie
          - type: button
            name: Info
            icon: mdi:information-outline
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/info
          - type: button
            name: Promo
            icon: mdi:cart-percent
            show_state: false
            grid_options:
              columns: 3
              rows: 1
            tap_action:
              action: navigate
              navigation_path: /dashboard-kiosk/promo
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            grid_options:
              columns: full
            content: >
              {% set items = state_attr('sensor.lidl_in_promo', 'items') or [] %}
              {% set kw = states('input_text.lidl_trefwoorden') | trim %}
              <h3><ha-icon icon="mdi:cart-percent"></ha-icon> Lidl
              <small>· {{ items | count }} {{ 'treffers' if kw not in ['', 'unknown'] else 'aanbiedingen' }}</small></h3>
              {% if items | count == 0 %}
              <p>Geen aanbiedingen{{ ' voor je trefwoorden' if kw not in ['', 'unknown'] }}.</p>
              {% else %}
              <table width="100%">
              {% for i in items %}
              <tr>
              <td width="64">{% if i.img %}<img src="{{ i.img }}" width="56">{% endif %}</td>
              <td><b>{{ i.titel }}</b><br>
              <small>{{ i.merk ~ ' · ' if i.merk }}{{ 't/m ' ~ i.tot if i.tot }}{{ ' · volgende week' if i.preview }}</small></td>
              <td align="right" width="80"><b>{{ i.label }}</b></td>
              </tr>
              {% endfor %}
              </table>
              {% endif %}

      - type: grid
        cards:
          - type: markdown
            grid_options:
              columns: full
            content: >
              {% set col = state_attr('sensor.colruyt_in_promo', 'producten') or [] %}
              <h3><ha-icon icon="mdi:store"></ha-icon> Colruyt
              <small>· {{ col | count }} in promo</small></h3>
              {% for p in col %}
              <p><ha-icon icon="mdi:sale"></ha-icon> {{ p }}</p>
              {% else %}
              <p>Niets van je watchlist in promo.</p>
              {% endfor %}
          - type: entities
            title: Instellingen
            grid_options:
              columns: full
            entities:
              - entity: input_text.lidl_trefwoorden
                name: Lidl trefwoorden
              - entity: input_text.colruyt_winkel_id
                name: Colruyt winkel-id
